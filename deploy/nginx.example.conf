# nginx in front of Shared List, mounted at /shared-list/ on an existing site.
# Start the app with BASE_PATH=/shared-list. For a whole domain, use BASE_PATH=/
# and `location /` instead.

location = /shared-list {
    return 301 /shared-list/;
}

# ^~ so regex locations elsewhere in the server never take these paths.
location ^~ /shared-list/ {
    # Or a Unix socket: proxy_pass http://unix:/run/shared-list/http.sock;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Room for an uploaded picture: up to MAX_IMAGE_KB (2 MB), sent as base64.
    client_max_body_size 4m;
}
